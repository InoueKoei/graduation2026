<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomare 白い面</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.hide-cursor { cursor: none; }
  #hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 15px/1.7 "Hiragino Sans", sans-serif; color: #999; text-align: center;
    pointer-events: none; transition: opacity .6s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">このウィンドウを白い面のディスプレイへ移して、クリックで全画面に<br>（F で全画面の切り替え）</div>
<script type="module" src="surface.js"></script>
</body>
</html>
