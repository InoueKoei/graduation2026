<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>活字パズル — ことばづくり</title>
  <link rel="stylesheet" href="sumi-tokens.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>活字パズル</h1>
      <p class="sub">ことばづくり — 並べた活字を読み取る</p>
    </div>
    <button id="theme-toggle" class="icon-btn" title="ライト / ダーク切替" aria-label="テーマ切替">◐</button>
  </header>

  <div id="cvStatus" class="status-bar">opencv.js を準備中…</div>
  <div id="errorBanner" role="alert" hidden></div>

  <div class="toolbar">
    <button id="setupCamBtn" disabled>1. カメラを準備する</button>
    <button id="startGameBtn" disabled>2. ゲーム開始</button>
    <button id="toggleVidBtn" disabled>カメラ / 出題 切替</button>
    <button id="checkBtn" disabled>決定</button>
    <button id="restartBtn" hidden>もう一度</button>
  </div>

  <div class="run-row">
    <div id="resultStatus"><span id="resultChip"></span></div>
    <div id="timerDisplay">Time: 00:00</div>
  </div>

  <div id="targetDisplay" hidden>
    <div id="targetWordText" class="kana">---</div>
  </div>

  <div id="viewContainer" hidden>
    <video id="video" playsinline autoplay muted hidden></video>
    <canvas id="output"></canvas>
  </div>

  <section class="panel">
    <div class="panel-label">読み取り中のことば</div>
    <div id="idsList" class="kana word-readout">— none —</div>

    <div class="panel-label div">ステータス</div>
    <div class="status-grid">
      <div><span class="k">検出数</span><b id="countVal">—</b></div>
      <div><span class="k">FPS</span><b id="fpsVal">—</b></div>
      <div><span class="k">解像度</span><b id="resVal">—</b></div>
      <div><span class="k">組版の乱れ</span><b id="disorderVal">—</b></div>
    </div>
    <p class="note">
      「組版の乱れ」は、出題語を理想の組版（水平・等間隔・角度ゼロ）としたときの平均のずれ。
      0 に近いほど揃っていて、字はくっきり刷られる。ずれるほど版が重なってにじむ。
    </p>

    <div class="panel-label div">ログ</div>
    <div id="log"></div>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
