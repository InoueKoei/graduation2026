<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atom Printer Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="layout">
    <section class="controls">
      <h1>Atom Printer Studio</h1>

      <div class="tabs" role="tablist">
        <button class="tab is-active" data-mode="text" role="tab">文字</button>
        <button class="tab" data-mode="image" role="tab">画像</button>
      </div>

      <!-- 文字 -->
      <div class="panel" data-panel="text">
        <label class="field">
          <span>本文</span>
          <textarea id="t-text" rows="5">あいうえお
文字を刷る</textarea>
        </label>

        <label class="field">
          <span>書体</span>
          <input id="t-font" list="font-list" value="Hiragino Mincho ProN">
          <datalist id="font-list">
            <option value="Hiragino Mincho ProN">
            <option value="Hiragino Kaku Gothic ProN">
            <option value="Hiragino Maru Gothic ProN">
            <option value="YuMincho">
            <option value="YuGothic">
            <option value="Klee">
            <option value="Toppan Bunkyu Mincho">
            <option value="Tsukushi A Round Gothic">
            <option value="Zen Maru Gothic">
            <option value="Osaka">
          </datalist>
        </label>

        <div class="row">
          <label class="field">
            <span>太さ</span>
            <select id="t-weight">
              <option value="400">標準</option>
              <option value="700">太字</option>
              <option value="300">細字</option>
            </select>
          </label>
          <label class="field">
            <span>揃え</span>
            <select id="t-align">
              <option value="left">左</option>
              <option value="center">中央</option>
              <option value="right">右</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>大きさ <output data-for="t-size"></output> ドット</span>
          <input id="t-size" type="range" min="12" max="384" value="56">
        </label>
        <label class="field">
          <span>行送り <output data-for="t-lineHeight"></output></span>
          <input id="t-lineHeight" type="range" min="0.8" max="3" step="0.05" value="1.4">
        </label>
        <label class="field">
          <span>字間 <output data-for="t-spacing"></output> ドット</span>
          <input id="t-spacing" type="range" min="-20" max="80" value="0">
        </label>
        <label class="field">
          <span>左右の余白 <output data-for="t-margin"></output> ドット</span>
          <input id="t-margin" type="range" min="0" max="96" value="8">
        </label>
        <label class="field">
          <span>上下の余白 <output data-for="t-padding"></output> ドット</span>
          <input id="t-padding" type="range" min="0" max="200" value="8">
        </label>
        <label class="field">
          <span>しきい値 <output data-for="t-threshold"></output></span>
          <input id="t-threshold" type="range" min="1" max="254" value="128">
        </label>
        <label class="check"><input id="t-invert" type="checkbox"> 白抜き</label>
      </div>

      <!-- 画像 -->
      <div class="panel" data-panel="image" hidden>
        <label class="drop" id="drop">
          <input id="i-file" type="file" accept="image/*" hidden>
          <span id="drop-label">画像をドロップ / クリックで選ぶ / ⌘V で貼り付け</span>
        </label>

        <label class="field">
          <span>幅 <output data-for="i-scale"></output> %</span>
          <input id="i-scale" type="range" min="10" max="100" value="100">
        </label>

        <div class="row">
          <label class="field">
            <span>回転</span>
            <select id="i-rotate">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </label>
          <label class="field">
            <span>白黒の作り方</span>
            <select id="i-dither">
              <option value="floyd">誤差拡散（Floyd–Steinberg）</option>
              <option value="atkinson">誤差拡散（Atkinson）</option>
              <option value="bayer">網点（Bayer）</option>
              <option value="threshold">しきい値で切る</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>明るさ <output data-for="i-brightness"></output></span>
          <input id="i-brightness" type="range" min="-100" max="100" value="0">
        </label>
        <label class="field">
          <span>コントラスト <output data-for="i-contrast"></output></span>
          <input id="i-contrast" type="range" min="-100" max="100" value="0">
        </label>
        <label class="field">
          <span>しきい値 <output data-for="i-threshold"></output></span>
          <input id="i-threshold" type="range" min="1" max="254" value="128">
        </label>
        <label class="field">
          <span>上下の余白 <output data-for="i-padding"></output> ドット</span>
          <input id="i-padding" type="range" min="0" max="200" value="0">
        </label>
        <label class="check"><input id="i-invert" type="checkbox"> 反転</label>
      </div>

      <div class="print">
        <label class="field">
          <span>プリンタの住所</span>
          <input id="host" value="192.168.4.1" spellcheck="false">
        </label>
        <label class="field">
          <span>印刷後の改行 <output data-for="feed"></output> 行</span>
          <input id="feed" type="range" min="0" max="10" value="3">
        </label>
        <div class="row">
          <button id="print" class="primary">印刷</button>
          <button id="feed-btn">紙送り</button>
        </div>
        <progress id="progress" max="1" value="0" hidden></progress>
        <p id="status" class="status"></p>
      </div>
    </section>

    <section class="preview">
      <div class="preview-head">
        <span id="info"></span>
        <label>表示
          <select id="zoom">
            <option value="1">等倍</option>
            <option value="2" selected>2倍</option>
          </select>
        </label>
      </div>
      <div class="paper"><canvas id="out"></canvas></div>
    </section>
  </main>

  <script src="js/printer.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
