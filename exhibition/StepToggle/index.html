<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepToggle — 踏むトグル入力</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 画面は Figma のフレームと同じ 1920×1080（縦長の窓では 1080×1920）で組み、窓の大きさに合わせて丸ごと縮める -->
  <div class="viewport">
    <div id="stage" class="stage">

      <!-- モード選択 -->
      <section id="screen-select" class="screen select">
        <p class="select-title">あそぶモードを選んでください</p>
        <div class="select-row">
          <button class="pill" data-mode="free"><span class="pill-main">ひとりで</span><span class="pill-sub">ステップ</span></button>
          <button class="pill" data-mode="duo"><span class="pill-main">ふたりで</span><span class="pill-sub">ステップ</span></button>
        </div>
        <p class="select-foot">マットの左の面を踏むと「ひとりで」、右の面を踏むと「ふたりで」</p>
      </section>

      <!-- チュートリアル-0（文章ウィンドウだけ） -->
      <section id="screen-intro" class="screen intro" hidden>
        <div class="msg"><span class="msg-tag">ヒント</span><p class="msg-body"><span class="msg-text" id="intro-text"></span></p></div>
      </section>

      <!-- チュートリアル／入力中。data-mode（free|duo）と data-phase（tutorial|input）で組み替える -->
      <section id="screen-play" class="screen play" data-mode="free" data-phase="tutorial" hidden>
        <div class="play-main">
          <div class="player player-left">
            <p class="player-label">左プレイヤー</p>
            <div id="board-0" class="board" aria-hidden="true"></div>
          </div>

          <div class="textcol">
            <p class="text-label">入力中の文字</p>
            <div id="text-box" class="text-box" aria-live="polite">
              <p class="text-line">
                <span id="committed"></span><span id="pending" class="pending"></span><i id="caret" class="caret" aria-hidden="true"></i>
              </p>
            </div>
          </div>

          <div class="player player-right">
            <p class="player-label">右プレイヤー</p>
            <div id="board-1" class="board" aria-hidden="true"></div>
          </div>
        </div>

        <div id="msg" class="msg"><span class="msg-tag">ヒント</span><p class="msg-body"><span class="msg-text" id="msg-text"></span><span class="msg-sub" id="msg-sub"></span></p></div>

        <!-- 入力中のメトロノーム（縦置きの Figma フレームにだけある）。2/4 の2拍を2つのランプで -->
        <div class="beat" aria-hidden="true">
          <div class="beat-dots"><i class="beat-dot"></i><i class="beat-dot"></i></div>
          <p id="beat-bpm" class="beat-bpm">40BPM</p>
        </div>
      </section>

    </div>
  </div>

  <!-- 調整。まだ詰めるので出したままにするが、作品の画面を邪魔しないよう小さく隅に置く -->
  <aside class="settings">
    <button id="settings-toggle" class="settings-toggle" aria-expanded="false" aria-controls="settings-body">調整</button>
    <div id="settings-body" class="settings-body" hidden>
      <p id="status" class="status">マットを探しています…</p>

      <div class="settings-actions">
        <button id="to-select" class="mini-btn" title="Esc">モード選択へ</button>
        <button id="skip-step" class="mini-btn" title="Enter">次の段へ</button>
        <button id="to-input" class="mini-btn">チュートリアルを飛ばす</button>
        <button id="clear-btn" class="mini-btn">全消し</button>
      </div>

      <label class="setting"><span class="setting-name">受付までの溜め</span><input id="hold-range" type="range" /><output id="hold-out"></output></label>
      <label class="setting"><span class="setting-name">踏み直しの溜め</span><input id="repeat-range" type="range" /><output id="repeat-out"></output></label>
      <label class="setting"><span class="setting-name">中央の連続踏み</span><input id="home-range" type="range" /><output id="home-out"></output></label>
      <label class="setting"><span class="setting-name">確定までの時間</span><input id="commit-range" type="range" /><output id="commit-out"></output></label>
      <label class="setting"><span class="setting-name">チャタリング除去</span><input id="debounce-range" type="range" /><output id="debounce-out"></output></label>
      <label class="setting"><span class="setting-name">相方の許容ずれ</span><input id="pair-range" type="range" /><output id="pair-out"></output></label>
      <label class="setting"><span class="setting-name">無操作で最初へ</span><input id="idle-range" type="range" /><output id="idle-out"></output></label>
      <label class="setting"><span class="setting-name">クリックの音量</span><input id="volume-range" type="range" /><output id="volume-out"></output></label>

      <div class="setting">
        <span class="setting-name">ふたりのずれ</span>
        <div class="shift-modes" role="group" aria-label="ずれの見せ方">
          <button class="shift-btn" data-shift="size">大きさ</button>
          <button class="shift-btn" data-shift="blur">ぼかし</button>
          <button class="shift-btn" data-shift="slice">短冊</button>
        </div>
        <label class="setting-check"><input id="duo-width-check" type="checkbox" autocomplete="off" /><span>字幅</span></label>
      </div>

      <div class="setting">
        <label class="setting-check">
          <input id="keyboard-check" type="checkbox" checked autocomplete="off" />
          <span>キーボード代替（<code>qwe/asd/zxc</code> <code>1</code> <code>2</code>、母音 <code>uio/jkl/,</code>）</span>
        </label>
        <button id="swap-btn" class="mini-btn">マットを入れ替える</button>
      </div>
    </div>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
