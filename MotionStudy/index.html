<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionStudy — 動きの四態</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="grid">
    <div class="cell" data-view="horizon"><span class="cap">水平</span></div>
    <div class="cell" data-view="plumb"><span class="cap">錘</span></div>
    <div class="cell" data-view="ring"><span class="cap">環</span></div>
    <div class="cell" data-view="field"><span class="cap">場</span></div>
  </div>
  <span id="dot" class="dot" title="接続状態"></span>

  <script type="module" src="js/main.js"></script>
</body>
</html>
